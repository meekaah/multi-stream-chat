<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiChat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="status-bar">
      <div class="status-item">
        <svg class="platform-logo twitch-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>
        </svg>
        <span class="dot" id="twitch-dot"></span>
        <span id="twitch-label">Connecting...</span>
      </div>

      <div class="app-title">MultiChat</div>

      <div class="status-item">
        <span id="youtube-label">Checking...</span>
        <span class="dot" id="youtube-dot"></span>
        <svg class="platform-logo youtube-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M23.495 6.205a3.007 3.007 0 0 0-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 0 0 .527 6.205a31.247 31.247 0 0 0-.522 5.805 31.247 31.247 0 0 0 .522 5.783 3.007 3.007 0 0 0 2.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 0 0 2.088-2.088 31.247 31.247 0 0 0 .5-5.783 31.247 31.247 0 0 0-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/>
        </svg>
      </div>
    </header>

    <div id="chat-container"></div>

    <div id="scroll-hint" class="hidden">scroll paused — hover out to resume</div>
  </div>
  <script src="client.js"></script>
</body>
</html>
